<header>

    <nav>
        <a href="main.html">Главная</a>

<main>
    <div class="card contact-card">
        <h1>Форма обратной связи</h1>
        <p class="lead">Оставьте ваше сообщение — мы свяжемся с вами в ближайшее время.</p>

        <form action="#" method="post">
            <div class="row grid-2">
                <div>
                    <label for="name">Имя *</label>
                    <input id="name" name="name" type="text" placeholder="Иван Иванов" required>
                </div>

                <div>
                    <label for="email">Email *</label>
                    <input id="email" name="email" type="email" placeholder="example@mail.com" required>
                </div>
            </div>

            <div class="row">
                <label for="message">Сообщение *</label>
                <textarea id="message" name="message" placeholder="Ваше сообщение..." required></textarea>
            </div>

            <div class="controls">
                <button type="reset">Очистить</button>
                <button type="submit">Отправить</button>
            </div>
        </form>
    </div>
</main>

<footer>

</footer>

</body>
